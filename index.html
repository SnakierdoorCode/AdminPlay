<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminPlay | Ported by Damien</title>
    <style>
        body { 
            margin: 0; 
            background-color: #050505; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: radial-gradient(white, rgba(255,255,255,.3) 1px, transparent 20px), radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 30px);
            background-size: 400px 400px, 250px 250px;
            animation: spaceFly 40s linear infinite;
        }

        @keyframes spaceFly {
            from { background-position: 0 0, 0 0; }
            to { background-position: 400px 800px, 250px 500px; }
        }

        #game-wrapper { 
            position: relative; 
            width: 960px; 
            height: 540px; 
            border: 2px solid #4ade80; 
            border-radius: 12px; 
            background: #000; 
            box-shadow: 0 0 40px rgba(74, 222, 128, 0.2); 
            overflow: hidden; 
            z-index: 5;
        }

        #canvas { 
            width: 100% !important; 
            height: 100% !important; 
            display: block; 
            outline: none; 
        }

        #inner-loading { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 20; 
        }

        .loader-pulse { 
            width: 60px; 
            height: 60px; 
            border: 3px solid rgba(74, 222, 128, 0.1); 
            border-radius: 50%; 
            border-top-color: #4ade80; 
            animation: spin 1s ease-in-out infinite; 
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #port-modal { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.92); 
            backdrop-filter: blur(8px); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
        }

        .modal-content { 
            background: rgba(10, 20, 10, 0.95); 
            color: white; 
            padding: 60px; 
            border-radius: 40px; 
            border: 1px solid #4ade80; 
            text-align: center; 
            max-width: 500px;
        }

        h1 { font-size: 3rem; margin: 0; letter-spacing: 5px; color: #4ade80; }
        p { color: #888; margin-bottom: 30px; }
        b { color: #fff; }

        button { 
            background: transparent; 
            color: #4ade80; 
            border: 2px solid #4ade80; 
            padding: 20px 60px; 
            font-weight: 900; 
            border-radius: 50px; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.4s; 
            letter-spacing: 2px;
        }

        button:hover { 
            background: #4ade80; 
            color: #000; 
            box-shadow: 0 0 30px #4ade80; 
        }

            position: absolute; 
            bottom: 10px; 
            right: 15px;
