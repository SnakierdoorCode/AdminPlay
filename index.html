<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Office System | Clean Port</title>
    <style>
        :root {
            --office-blue: #0078d4;
            --glow-blue: #4db2ff;
            --deep-bg: #0d0d0d;
            --ui-gray: #333;
        }

        body { 
            margin: 0; 
            background-color: var(--deep-bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', system-ui, sans-serif;
            /* Subfloor Grid Animation */
            background-image: 
                linear-gradient(rgba(0, 120, 212, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 120, 212, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridScroll 120s linear infinite;
        }

        @keyframes gridScroll {
            from { background-position: 0 0; }
            to { background-position: 600px 600px; }
        }

        /* THE PURE GAME FRAME */
        #game-wrapper { 
            position: relative; 
            width: 960px; 
            height: 540px; 
            border: 1px solid var(--ui-gray); 
            background: #000; 
            box-shadow: 0 40px 80px rgba(0,0,0,0.9); 
            z-index: 5;
        }

        /* Fullscreen state - removes borders/external UI */
        #game-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;
            border: none;
        }

        canvas { 
            width: 100% !important; 
            height: 100% !important; 
            display: block; 
            image-rendering: pixelated; 
        }

        /* EXTERNAL FULLSCREEN BUTTON (Under the game) */
        #external-controls {
            margin-top: 20px;
            z-index: 10;
        }

        .fs-toggle {
            background: transparent;
            border: 1px solid var(--ui-gray);
            color: #666;
            padding: 8px 24px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .fs-toggle:hover {
            border-color: var(--office-blue);
            color: var(--glow-blue);
            background: rgba(0, 120, 212, 0.05);
            box-shadow: 0 0 15px rgba(0, 120, 212, 0.2);
        }

        /* ABSOLUTE EXTERNAL TAG (Bottom Right of screen) */
        .external-tag {
            position: absolute;
            bottom: 30px;
            right: 40px;
            text-align: right;
            pointer-events: none;
            z-index: 1;
        }

        .tag-sub {
            display: block;
            font-family: monospace;
            font-size: 9px;
            color: #333;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }

        .tag-main {
            font-weight: 900;
            font-size: 14px;
            color: rgba(77, 178, 255, 0.4);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* LOADING OVERLAY */
        #overlay { 
            position: absolute; 
            inset: 0; 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(25px); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
        }

        .login-card {
            text-align: center;
            border-left: 2px solid var(--office-blue);
            padding-left: 30px;
        }

        h1 { font-size: 1.4rem; margin: 0; font-weight: 300; letter-spacing: 10px; color: var(--office-blue); }
        
        .launch-btn { 
            background: var(--office-blue); 
            color: white; 
            border: none; 
            padding: 12px 50px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 30px;
            letter-spacing: 1px;
        }

        #status { margin-top: 20px; color: #444; font-size: 9px; font-family: monospace; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="canvas" tabindex="0"></canvas>
        
        <div id="overlay">
            <div class="login-card">
                <h1>ADMIN PLAY</h1>
                <button id="launch-btn" class="launch-btn">SIGN IN</button>
                <div id="status">CONNECTION ENCRYPTED</div>
            </div>
        </div>
    </div>

    <div id="external-controls">
        <button id="fs-btn" class="fs-toggle" style="display: none;">[ Expand Session ]</button>
    </div>

    <div class="external-tag">
        <span class="tag-sub">SECURE_STATION_ACTIVE</span>
        <span class="tag-main">DAMIEN / SNAKIERDOOR</span>
    </div>

    <script src="https://rawcdn.githack.com/SnakierdoorCode/AdminPlay/main/index.js"></script>

    <script>
        const launchBtn = document.getElementById('launch-btn');
        const fsBtn = document.getElementById('fs-btn');
        const status = document.getElementById('status');
        const overlay = document.getElementById('overlay');
        const canvas = document.getElementById('canvas');
        const wrapper = document.getElementById('game-wrapper');
        const REPO = "https://rawcdn.githack.com/SnakierdoorCode/AdminPlay/main/";

        // HiDPI Scaling Fix
        function initRes() {
            const scale = window.devicePixelRatio || 1;
            canvas.width = 960 * scale;
            canvas.height = 540 * scale;
        }
        initRes();

        // Fullscreen Logic
        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

        launchBtn.addEventListener('click', async () => {
            launchBtn.style.display = 'none';
            status.innerText = "AUTHENTICATING...";

            const engine = new Engine({
                canvas: canvas,
                locateFile: (path) => REPO + path
            });

            try {
                await engine.init(REPO + "index");
                status.innerText = "SYNCING ARCHIVES...";
                
                const res = await fetch(REPO + "index.pck");
                const buffer = await res.arrayBuffer();
                engine.copyToFS("index.pck", buffer);

                status.innerText = "OPENING PORT...";
                await engine.start("--main-pack", "index.pck");

                overlay.style.display = 'none';
                fsBtn.style.display = 'inline-block';

            } catch (err) {
                status.innerText = "SESSION REJECTED";
                launchBtn.style.display = 'block';
            }
        });
    </script>
</body>
</html>
