<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Office System | Night Shift</title>
    <style>
        :root {
            --office-blue: #0078d4;
            --dark-ui: #1b1b1b;
            --deep-bg: #0d0d0d;
            --text-main: #e1dfdd;
        }

        body { 
            margin: 0; 
            background-color: var(--deep-bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', system-ui, sans-serif;
            /* Dark Grid - much easier on the eyes */
            background-image: 
                linear-gradient(rgba(0, 120, 212, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 120, 212, 0.1) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridScroll 100s linear infinite;
        }

        @keyframes gridScroll {
            from { background-position: 0 0; }
            to { background-position: 600px 600px; }
        }

        #game-wrapper { 
            position: relative; 
            width: 960px; 
            height: 540px; 
            border: 1px solid #333; 
            border-radius: 4px; 
            background: #000; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); 
            z-index: 5;
        }

        #game-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;
            border: none;
        }

        canvas { 
            width: 100% !important; 
            height: 100% !important; 
            display: block; 
            outline: none; 
            /* THE PIXEL FIX: Prevents the browser from blurring the image */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        /* Dark Mode Overlay */
        #overlay { 
            position: absolute; 
            inset: 0; 
            background: rgba(13, 13, 13, 0.9); 
            backdrop-filter: blur(10px); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            color: var(--text-main);
        }

        .office-card {
            background: var(--dark-ui);
            padding: 50px;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: center;
        }

        h1 { font-size: 2rem; margin: 0; font-weight: 300; letter-spacing: 4px; color: var(--office-blue); }
        p { color: #a19f9d; margin-bottom: 30px; font-size: 13px; letter-spacing: 1px; }

        .ui-btn { 
            background: var(--office-blue); 
            color: white; 
            border: none; 
            padding: 12px 40px; 
            font-weight: 600; 
            border-radius: 2px; 
            cursor: pointer; 
            transition: 0.3s; 
            text-transform: uppercase;
            font-size: 14px;
        }

        .ui-btn:hover { background: #2b88d8; filter: brightness(1.2); }

        #fs-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(27, 27, 27, 0.8);
            border: 1px solid #444;
            color: #888;
            padding: 8px 16px;
            font-size: 10px;
            z-index: 101;
            cursor: pointer;
        }

        .corner-tag {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #444;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #status { margin-top: 20px; color: var(--office-blue); font-size: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="canvas" tabindex="0"></canvas>
        
        <div class="corner-tag">SNAKIERDOOR // DAMIEN</div>
        <button id="fs-btn" style="display:none;">EXPAND VIEW</button>

        <div id="overlay">
            <div class="office-card">
                <h1>ADMIN PLAY</h1>
                <p>NIGHT SHIFT PROTOCOL ACTIVE</p>
                <button id="launch-btn" class="ui-btn">BOOT SESSION</button>
                <div id="status">STANDBY</div>
            </div>
        </div>
    </div>

    <script src="https://rawcdn.githack.com/SnakierdoorCode/AdminPlay/main/index.js"></script>

    <script>
        const launchBtn = document.getElementById('launch-btn');
        const fsBtn = document.getElementById('fs-btn');
        const status = document.getElementById('status');
        const overlay = document.getElementById('overlay');
        const canvas = document.getElementById('canvas');
        const REPO = "https://rawcdn.githack.com/SnakierdoorCode/AdminPlay/main/";

        // HIDPI FIX: This forces the canvas to render at your screen's actual resolution
        function adjustResolution() {
            const scale = window.devicePixelRatio || 1;
            canvas.width = 960 * scale;
            canvas.height = 540 * scale;
        }
        window.addEventListener('resize', adjustResolution);
        adjustResolution();

        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) document.getElementById('game-wrapper').requestFullscreen();
            else document.exitFullscreen();
        });

        launchBtn.addEventListener('click', async () => {
            launchBtn.style.display = 'none';
            status.innerText = "INITIALIZING CORE...";

            const engine = new Engine({
                canvas: canvas,
                locateFile: (path) => REPO + path
            });

            try {
                await engine.init(REPO + "index");
                status.innerText = "STREAMING DATA...";
                
                const res = await fetch(REPO + "index.pck");
                const buffer = await res.arrayBuffer();
                engine.copyToFS("index.pck", buffer);

                status.innerText = "STARTING...";
                await engine.start("--main-pack", "index.pck");

                overlay.style.display = 'none';
                fsBtn.style.display = 'block';

            } catch (err) {
                status.innerText = "CONNECTION FAILED";
                launchBtn.style.display = 'block';
            }
        });
    </script>
</body>
</html>
