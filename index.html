<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>AdminPlay Port | Fixed</title>
    <style>
        body { margin: 0; background: #000; color: #4ade80; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: monospace; }
        #game-wrapper { position: relative; width: 960px; height: 540px; border: 1px solid #4ade80; }
        canvas { width: 100%; height: 100%; display: block; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        button { border: 2px solid #4ade80; background: none; color: #4ade80; padding: 10px 20px; cursor: pointer; font-family: monospace; }
        #status { margin-top: 10px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="canvas"></canvas>
        <div id="overlay">
            <h1>ADMIN PLAY</h1>
            <button id="launch-btn">LAUNCH SYSTEM</button>
            <div id="status">Ready.</div>
        </div>
    </div>

    <script src="https://rawcdn.githack.com/SnakierdoorCode/AdminPlay/main/index.js"></script>

    <script>
        const launchBtn = document.getElementById('launch-btn');
        const status = document.getElementById('status');
        const REPO = "https://rawcdn.githack.com/SnakierdoorCode/AdminPlay/main/";

        launchBtn.addEventListener('click', async () => {
            launchBtn.style.display = 'none';
            status.innerText = "Connecting...";

            const engine = new Engine({
                canvas: document.getElementById('canvas'),
                locateFile: (path) => REPO + path
            });

            try {
                // 1. Load WASM
                status.innerText = "Loading WASM...";
                await engine.init(REPO + "index");

                // 2. Fetch PCK
                status.innerText = "Downloading Assets...";
                const res = await fetch(REPO + "index.pck");
                const buffer = await res.arrayBuffer();

                // 3. Inject into FS
                // We use the file name as a plain string to avoid the charCodeAt error
                status.innerText = "Mounting...";
                engine.copyToFS("index.pck", buffer);

                // 4. Start - FIXED ARGUMENTS
                status.innerText = "Booting...";
                
                // Instead of passing a complex object, we pass the command-line args
                // that Godot expects to find its main pack.
                await engine.start("--main-pack", "index.pck");

                // Success
                document.getElementById('overlay').style.display = 'none';

            } catch (err) {
                console.error("Boot Error:", err);
                status.innerText = "Error: " + err.message;
                status.style.color = "red";
            }
        });
    </script>
</body>
</html>
