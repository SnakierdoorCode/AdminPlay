<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Locked | AdminPlay Port</title>
    <style>
        /* SPACE FLY CSS INTEGRATION */
        body { 
            margin: 0; 
            background-color: #050505; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: radial-gradient(white, rgba(255,255,255,.3) 1px, transparent 20px), radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 30px);
            background-size: 400px 400px, 250px 250px;
            animation: spaceFly 40s linear infinite;
        }

        @keyframes spaceFly {
            from { background-position: 0 0, 0 0; }
            to { background-position: 400px 800px, 250px 500px; }
        }

        /* GAME WRAPPER */
        #game-wrapper { 
            position: relative; 
            width: 960px; 
            height: 540px; 
            border: 2px solid #4ade80; 
            border-radius: 12px; 
            background: #000; 
            box-shadow: 0 0 40px rgba(74, 222, 128, 0.2); 
            overflow: hidden; 
            z-index: 5;
        }

        canvas { 
            width: 100% !important; 
            height: 100% !important; 
            display: block; 
            outline: none; 
        }

        /* MODAL / OVERLAY */
        #overlay { 
            position: absolute; 
            inset: 0; 
            background: rgba(0,0,0,0.92); 
            backdrop-filter: blur(8px); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            color: white;
            text-align: center;
        }

        h1 { font-size: 3rem; margin: 0; letter-spacing: 5px; color: #4ade80; }
        p { color: #888; margin-bottom: 30px; }

        button { 
            background: transparent; 
            color: #4ade80; 
            border: 2px solid #4ade80; 
            padding: 20px 60px; 
            font-weight: 900; 
            border-radius: 50px; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.4s; 
            letter-spacing: 2px;
            font-family: monospace;
        }

        button:hover { 
            background: #4ade80; 
            color: #000; 
            box-shadow: 0 0 30px #4ade80; 
        }

        #status { 
            margin-top: 20px; 
            font-size: 12px; 
            color: #4ade80; 
            font-family: monospace;
            text-transform: uppercase;
        }

        .game-corner-tag { 
            position: absolute; 
            bottom: 10px; 
            right: 15px; 
            color: rgba(74, 222, 128, 0.4); 
            font-size: 10px; 
            font-weight: bold; 
            pointer-events: none; 
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="canvas" tabindex="0"></canvas>
        
        <div id="overlay">
            <h1>ADMIN PLAY</h1>
            <p>System Port by <b>Damien / Snakierdoor</b></p>
            <button id="launch-btn">LAUNCH SYSTEM</button>
            <div id="status">READY</div>
            <div class="game-corner-tag">DAMIEN / SNAKIERDOOR</div>
        </div>
    </div>

    <script src="https://rawcdn.githack.com/SnakierdoorCode/AdminPlay/main/index.js"></script>

    <script>
        const launchBtn = document.getElementById('launch-btn');
        const status = document.getElementById('status');
        const overlay = document.getElementById('overlay');
        const REPO = "https://rawcdn.githack.com/SnakierdoorCode/AdminPlay/main/";

        launchBtn.addEventListener('click', async () => {
            launchBtn.style.display = 'none';
            status.innerText = "Connecting...";

            const engine = new Engine({
                canvas: document.getElementById('canvas'),
                locateFile: (path) => REPO + path
            });

            try {
                // 1. Load WASM
                status.innerText = "Loading WASM...";
                await engine.init(REPO + "index");

                // 2. Fetch PCK
                status.innerText = "Downloading Assets...";
                const res = await fetch(REPO + "index.pck");
                const buffer = await res.arrayBuffer();

                // 3. Inject into FS
                status.innerText = "Mounting Filesystem...";
                engine.copyToFS("index.pck", buffer);

                // 4. Start
                status.innerText = "Booting Engine...";
                await engine.start("--main-pack", "index.pck");

                // Success - Hide the overlay to show the game
                overlay.style.display = 'none';

            } catch (err) {
                console.error("Boot Error:", err);
                status.innerText = "Error: " + err.message;
                status.style.color = "red";
                launchBtn.style.display = 'block'; // Show button again so they can retry
            }
        });
    </script>
</body>
</html>
