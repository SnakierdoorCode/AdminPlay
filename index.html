<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Office System | Secured</title>
    <style>
        :root {
            --office-blue: #0078d4;
            --glow-blue: #4db2ff;
            --dark-ui: #1b1b1b;
            --deep-bg: #0d0d0d;
        }

        body { 
            margin: 0; 
            background-color: var(--deep-bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-image: 
                linear-gradient(rgba(0, 120, 212, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 120, 212, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridScroll 120s linear infinite;
        }

        @keyframes gridScroll {
            from { background-position: 0 0; }
            to { background-position: 600px 600px; }
        }

        #game-wrapper { 
            position: relative; 
            width: 960px; 
            height: 540px; 
            border: 1px solid #333; 
            background: #000; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.8); 
            z-index: 5;
        }

        #game-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;
        }

        canvas { 
            width: 100% !important; 
            height: 100% !important; 
            display: block; 
            image-rendering: pixelated; /* Sharpest possible rendering */
        }

        /* THE ABSOLUTE BOTTOM RIGHT TAG */
        .security-tag {
            position: absolute;
            bottom: 15px;
            right: 15px;
            text-align: right;
            pointer-events: none;
            z-index: 999; /* Stays above everything */
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .security-tag:hover { opacity: 1; }

        .tag-label {
            display: block;
            font-family: monospace;
            font-size: 8px;
            color: #555;
            letter-spacing: 1px;
            margin-bottom: -2px;
        }

        .tag-name {
            font-weight: 900;
            font-size: 11px;
            color: var(--glow-blue);
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(77, 178, 255, 0.3);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; filter: blur(0px); }
            50% { opacity: 1; filter: blur(0.2px); }
        }

        #overlay { 
            position: absolute; 
            inset: 0; 
            background: rgba(10, 10, 10, 0.8); 
            backdrop-filter: blur(20px); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
        }

        .office-card {
            background: var(--dark-ui);
            padding: 45px;
            border: 1px solid #333;
            text-align: center;
        }

        h1 { font-size: 1.5rem; margin: 0; font-weight: 300; letter-spacing: 8px; color: var(--office-blue); }
        
        .ui-btn { 
            background: var(--office-blue); 
            color: white; 
            border: none; 
            padding: 10px 40px; 
            font-weight: 600; 
            cursor: pointer; 
            text-transform: uppercase;
            font-size: 12px;
            margin-top: 25px;
        }

        #fs-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            color: #666;
            padding: 4px 8px;
            font-size: 8px;
            z-index: 101;
            cursor: pointer;
        }

        #status { margin-top: 15px; color: #444; font-size: 9px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="canvas" tabindex="0"></canvas>
        
        <div class="security-tag">
            <span class="tag-label">SYSTEM_PORT_BY</span>
            <span class="tag-name">DAMIEN / SNAKIERDOOR</span>
        </div>

        <button id="fs-btn" style="display:none;">[ FULLSCREEN ]</button>

        <div id="overlay">
            <div class="office-card">
                <h1>ADMIN PLAY</h1>
                <button id="launch-btn" class="ui-btn">BOOT SESSION</button>
                <div id="status">ENCRYPTION: AES-256 ACTIVE</div>
            </div>
        </div>
    </div>

    <script src="https://rawcdn.githack.com/SnakierdoorCode/AdminPlay/main/index.js"></script>

    <script>
        const launchBtn = document.getElementById('launch-btn');
        const fsBtn = document.getElementById('fs-btn');
        const status = document.getElementById('status');
        const overlay = document.getElementById('overlay');
        const canvas = document.getElementById('canvas');
        const REPO = "https://rawcdn.githack.com/SnakierdoorCode/AdminPlay/main/";

        // HIDPI Sharpness Fix
        function setRes() {
            const scale = window.devicePixelRatio || 1;
            canvas.width = 960 * scale;
            canvas.height = 540 * scale;
        }
        setRes();

        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) document.getElementById('game-wrapper').requestFullscreen();
            else document.exitFullscreen();
        });

        launchBtn.addEventListener('click', async () => {
            launchBtn.style.display = 'none';
            status.innerText = "BYPASSING FIREWALL...";

            const engine = new Engine({
                canvas: canvas,
                locateFile: (path) => REPO + path
            });

            try {
                await engine.init(REPO + "index");
                status.innerText = "STREAMING...";
                const res = await fetch(REPO + "index.pck");
                const buffer = await res.arrayBuffer();
                engine.copyToFS("index.pck", buffer);
                await engine.start("--main-pack", "index.pck");

                overlay.style.display = 'none';
                fsBtn.style.display = 'block';

            } catch (err) {
                status.innerText = "CRITICAL ERROR";
                launchBtn.style.display = 'block';
            }
        });
    </script>
</body>
</html>
