<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>AdminPlay Port | Fixed</title>
    <style>
        body { margin: 0; background: #050505; color: #4ade80; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: monospace; }
        #game-container { position: relative; width: 960px; height: 540px; border: 2px solid #4ade80; background: #000; }
        canvas { width: 100%; height: 100%; display: block; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; padding: 20px; }
        button { background: none; border: 2px solid #4ade80; color: #4ade80; padding: 15px 30px; cursor: pointer; font-family: monospace; font-weight: bold; }
        button:hover { background: #4ade80; color: #000; }
        #status { margin-top: 15px; color: #888; font-size: 12px; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="overlay">
            <h1>ADMIN PLAY</h1>
            <button id="start-btn">INITIALIZE SYSTEM</button>
            <div id="status">Checking resources...</div>
        </div>
        <canvas id="canvas"></canvas>
    </div>

    <script src="https://rawcdn.githack.com/SnakierdoorCode/AdminPlay/main/index.js"></script>

    <script>
        const status = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        
        // Ensure this matches your GitHub folder structure EXACTLY
        const BASE = "https://rawcdn.githack.com/SnakierdoorCode/AdminPlay/main/";

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            status.innerText = "Connecting to Engine...";

            if (typeof Engine === 'undefined') {
                status.innerText = "ERROR: index.js not found (404). Check GitHub file name.";
                return;
            }

            const engine = new Engine({
                canvas: document.getElementById('canvas'),
                // This tells the engine where to find the .wasm and .pck files
                locateFile: (path) => {
                    console.log("Engine requesting:", path);
                    return BASE + path;
                }
            });

            try {
                status.innerText = "Loading WASM core...";
                // We point to the prefix, the engine adds .wasm automatically
                await engine.init(BASE + "index");

                status.innerText = "Downloading Game Data...";
                const res = await fetch(BASE + "index.pck");
                
                if (!res.ok) throw new Error(`PCK missing at ${BASE}index.pck`);
                
                const buffer = await res.arrayBuffer();

                status.innerText = "Injecting PCK...";
                engine.copyToFS("index.pck", buffer);

                status.innerText = "Starting Engine...";
                await engine.start(["--main-pack", "index.pck"]);
                
                document.getElementById('overlay').style.display = 'none';
            } catch (err) {
                console.error("Boot Error:", err);
                status.innerText = "FATAL: " + err.message;
                status.style.color = "#ff4444";
            }
        });
    </script>
</body>
</html>
